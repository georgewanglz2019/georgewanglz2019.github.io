<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Lab — 风格实验室 · Leizhen Wang</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0d1017;
    color: #e6eaf0;
    font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    max-width: 1280px; margin: 0 auto; padding: 44px 28px 10px;
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  }
  h1 { font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
  h1 .accent { color: #7cc7f0; }
  .sub { color: #9aa4b2; font-size: 0.88rem; }
  .tools { margin-left: auto; display: flex; gap: 10px; }
  .tools a, .tools button {
    border: 1px solid rgba(148,163,184,0.35); border-radius: 999px;
    padding: 6px 16px; font-size: 0.8rem; color: #d6dce5; text-decoration: none;
    background: transparent; cursor: pointer; font-family: inherit;
  }
  .tools a:hover, .tools button:hover { border-color: #7cc7f0; color: #7cc7f0; }
  .grid {
    max-width: 1280px; margin: 0 auto; padding: 26px 28px 90px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 26px;
  }
  .item {
    border: 1px solid rgba(148,163,184,0.2); border-radius: 16px;
    background: #11151f; overflow: hidden;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .item:hover { transform: translateY(-4px); border-color: rgba(124,199,240,0.5); box-shadow: 0 18px 44px rgba(0,0,0,0.5); }
  .shot {
    position: relative; height: 260px; overflow: hidden; background: #fff;
  }
  .shot iframe {
    width: 1280px; height: 900px; border: 0;
    transform: scale(0.3025); transform-origin: 0 0;
    pointer-events: none;
  }
  .meta { display: flex; align-items: center; gap: 12px; padding: 16px 20px; }
  .num {
    font-family: Monaco, Consolas, monospace; font-size: 0.72rem; color: #7cc7f0;
    border: 1px solid rgba(124,199,240,0.4); border-radius: 6px; padding: 2px 8px;
  }
  .name { font-weight: 700; font-size: 0.98rem; }
  .name small { display: block; color: #9aa4b2; font-weight: 400; font-size: 0.78rem; margin-top: 2px; }
  .open {
    margin-left: auto; font-size: 0.8rem; font-weight: 600; color: #7cc7f0; text-decoration: none;
    border: 1px solid rgba(124,199,240,0.4); border-radius: 999px; padding: 6px 16px;
  }
  .open:hover { background: rgba(124,199,240,0.12); }
  footer { text-align: center; color: #5d6675; font-size: 0.78rem; padding-bottom: 40px; }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    .shot iframe { transform: scale(0.29); }
  }
</style>
</head>
<body>
<header>
  <h1>Style Lab <span class="accent">· 风格实验室</span></h1>
  <span class="sub">同一内容，五种表达。点击卡片进入对应风格，页内右下角可随时切换。</span>
  <div class="tools">
    <button id="langBtn">EN</button>
    <a href="/">← 返回主页</a>
  </div>
</header>
<div class="grid" id="grid"></div>
<footer>内容源：lab/content.json · 改一处，全部风格同步更新</footer>

<script>
var STYLES = [
  ["terminal",   "Hacker Terminal",     "黑客终端 — 命令行里的极客简历"],
  ["swiss",      "Swiss International", "瑞士国际主义 — 网格、Helvetica、红色点缀"],
  ["ink",        "Chinese Ink Wash",    "中国水墨 — 宣纸、楷体、朱砂印章"],
  ["academic",   "Academic Rigour",     "学术严谨 — LaTeX 论文式排版"],
  ["magazine",   "Editorial Magazine",  "杂志风尚 — 大标题、衬线、编辑排版"]
];
var zh = (localStorage.getItem("lab-lang") || "en") === "zh";
var grid = document.getElementById("grid");
STYLES.forEach(function (s, i) {
  var item = document.createElement("div");
  item.className = "item";
  item.innerHTML =
    '<div class="shot"><iframe src="' + s[0] + '.html" loading="lazy" title="' + s[1] + '"></iframe></div>' +
    '<div class="meta"><span class="num">' + String(i + 1).padStart(2, "0") + '</span>' +
    '<span class="name">' + (zh ? s[2] : s[1]) + '<small>' + (zh ? s[1] : s[2]) + '</small></span>' +
    '<a class="open" href="' + s[0] + '.html">' + (zh ? "进入 →" : "Open →") + '</a></div>';
  grid.appendChild(item);
});
var btn = document.getElementById("langBtn");
btn.textContent = zh ? "中文" : "EN";
btn.addEventListener("click", function () {
  localStorage.setItem("lab-lang", zh ? "en" : "zh");
  location.reload();
});
</script>
</body>
</html>
